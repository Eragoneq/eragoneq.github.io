name: Build public site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-public:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install minifier dependencies
        run: npm ci

      - name: Run tests
        run: ./gradlew test

      - name: Generate minified public site
        run: npm run build:public

      - name: Validate internal links and XML
        run: ./gradlew validatePublicSite

      # GitHub.com requires the v4 artifact service, while Forgejo supports the
      # v3 protocol without requiring its patched v4 action fork.
      - name: Upload public site (GitHub)
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: public/
          if-no-files-found: error
          retention-days: 14

      - name: Upload public site (Forgejo)
        if: ${{ github.server_url != 'https://github.com' }}
        uses: actions/upload-artifact@v3
        with:
          name: public-site
          path: public/
          if-no-files-found: error
          retention-days: 14
