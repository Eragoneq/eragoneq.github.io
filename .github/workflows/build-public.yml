name: Build public site

on:
  push:
    branches: [gh-mirror]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-public:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install minifier dependencies
        run: npm ci

      - name: Run tests
        run: ./gradlew test

      - name: Generate minified public site
        run: npm run build:public

      - name: Validate internal links and XML
        run: ./gradlew validatePublicSite

      - name: Setup Pages
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/configure-pages@v5

      - name: Upload public site (GitHub)
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: public/
          retention-days: 14

      - name: Deploy to GitHub Pages
        if: ${{ github.server_url == 'https://github.com' }}
        id: deployment
        uses: actions/deploy-pages@v5
